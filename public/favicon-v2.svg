<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#863bff"/>
      <stop offset="100%" stop-color="#7e14ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="#0a0a0a"/>
  <!-- Flowing F/S monogram — single continuous calligraphic stroke -->
  <path
    d="
      M 200 100
      C 200 100, 340 90, 340 150
      C 340 195, 240 200, 220 210
      C 200 220, 310 220, 310 240
      C 310 260, 210 270, 200 280
      C 180 300, 310 310, 310 360
      C 310 420, 170 430, 170 420
    "
    fill="none"
    stroke="url(#flow)"
    stroke-width="30"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Top accent loop -->
  <circle cx="200" cy="100" r="4" fill="#a855f7" opacity="0"/>
</svg>
