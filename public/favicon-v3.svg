<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="purple-stream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e14ff"/>
    </linearGradient>
    <linearGradient id="cyan-stream" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#47bfff"/>
      <stop offset="100%" stop-color="#38a3db"/>
    </linearGradient>
    <linearGradient id="purple-stream-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b06aff"/>
      <stop offset="100%" stop-color="#863bff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="#0a0a0a"/>

  <!-- Purple stream 1 (left, flows top-right to bottom-left) -->
  <path
    d="M 140 60
       C 140 60, 100 180, 170 256
       C 240 332, 120 400, 140 460"
    fill="none"
    stroke="url(#purple-stream)"
    stroke-width="32"
    stroke-linecap="round"
  />

  <!-- Purple stream 2 (parallel to stream 1, offset right) -->
  <path
    d="M 220 50
       C 220 50, 170 170, 240 256
       C 310 342, 200 400, 210 455"
    fill="none"
    stroke="url(#purple-stream-2)"
    stroke-width="28"
    stroke-linecap="round"
  />

  <!-- Cyan stream (right side, crosses over) -->
  <path
    d="M 370 70
       C 370 70, 410 180, 310 270
       C 210 360, 350 420, 360 465"
    fill="none"
    stroke="url(#cyan-stream)"
    stroke-width="32"
    stroke-linecap="round"
  />

  <!-- Glow intersection overlay -->
  <circle cx="256" cy="260" r="28" fill="#863bff" opacity="0.15" filter="blur(12px)"/>
</svg>
